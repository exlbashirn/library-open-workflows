@if (loading) {
  <div class="loading-shade">
    <mat-spinner diameter="50"></mat-spinner>
  </div>
} @else if (loadError) {
  <app-error-state message="Failed to load items. Please try again." (retry)="retryLoad()"></app-error-state>
} @else {
  <mat-tab-group [selectedIndex]="activeTabIndex" [dynamicHeight]="true" animationDuration="300ms" (selectedIndexChange)="onTabChange($event)">

    <!-- ==================== FORMS TAB ==================== -->
    <mat-tab>
      <ng-template mat-tab-label>
        <app-resource-tab-label icon="assignment" title="Forms" [count]="forms.length"></app-resource-tab-label>
      </ng-template>
      <app-resource-main-list
        [items]="forms"
        resourceType="form"
        [searchValue]="searchValue"
        [searching]="searching"
        (searchChange)="onSearchChange($event)"
        (clearSearch)="clearSearch()">
      </app-resource-main-list>
    </mat-tab>

    <!-- ==================== CHATS TAB ==================== -->
    <mat-tab>
      <ng-template mat-tab-label>
        <app-resource-tab-label icon="chat" title="Chats" [count]="chats.length"></app-resource-tab-label>
      </ng-template>
      <app-resource-main-list
        [items]="chats"
        resourceType="chat"
        [searchValue]="searchValue"
        [searching]="searching"
        (searchChange)="onSearchChange($event)"
        (clearSearch)="clearSearch()">
      </app-resource-main-list>
    </mat-tab>

  </mat-tab-group>
}
